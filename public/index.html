<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211035"><title>차원대충돌! — 온라인 보드게임</title><link rel="stylesheet" href="/style.css"></head><body><div id="app"></div><div id="toast" role="status"></div><dialog id="console"><form id="command"><div class="dialog-head"><span>개발자 콘솔</span><button type="button" id="close-console" class="icon">×</button></div><p>리소스 관리 명령을 입력하세요.</p><div class="row"><input id="code" autocomplete="off" placeholder="> 명령어 입력" required><button>실행 ↵</button></div></form><div id="resources" hidden><hr><div class="row"><strong>카드 리소스</strong><span id="resource-count"></span></div><p>선택한 순서대로 빈 카드에 적용됩니다. PNG · JPG · WebP / 장당 2MB</p><label class="upload">＋ 앞면 이미지 추가<input id="faces" type="file" multiple accept="image/png,image/jpeg,image/webp"></label><label class="upload secondary">뒷면 이미지 교체<input id="back" type="file" accept="image/png,image/jpeg,image/webp"></label><p id="upload-status"></p></div></dialog><script type="module" src="/app.js"></script></body></html>
